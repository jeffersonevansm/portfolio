<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Portfolio Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0b0b; --panel:#151515; --panel-2:#1d1d1d; --line:rgba(255,255,255,.1); --line-2:rgba(255,255,255,.18);
    --ink:#fff; --ink-2:#b3b3b3; --ink-3:#7a7a7a; --red:#e50914; --green:#46d369; --amber:#f5a524;
    --display:"Bebas Neue","Segoe UI",system-ui,sans-serif; --body:"Manrope",system-ui,-apple-system,sans-serif;
  }
  *,*::before,*::after{ box-sizing:border-box; }
  html,body{ margin:0; background:var(--bg); color:var(--ink); font-family:var(--body); font-size:15px; -webkit-font-smoothing:antialiased; }
  button,input,textarea,select{ font:inherit; color:inherit; }
  a{ color:#fff; }

  /* top bar */
  .bar{ position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:12px; padding:12px 20px; background:rgba(11,11,11,.92); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); }
  .brand{ font-family:var(--display); font-size:1.6rem; letter-spacing:.04em; line-height:1; white-space:nowrap; }
  .brand span{ color:var(--red); }
  .who{ color:var(--ink-3); font-size:.8rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .spacer{ flex:1; }
  .status{ font-size:.8rem; color:var(--ink-2); white-space:nowrap; }
  .status.dirty{ color:var(--amber); }
  .btn{ border:1px solid var(--line-2); background:var(--panel-2); border-radius:6px; padding:9px 14px; font-weight:700; font-size:.85rem; cursor:pointer; white-space:nowrap; }
  .btn:hover{ border-color:#fff; }
  .btn.primary{ background:var(--red); border-color:var(--red); }
  .btn.primary:hover{ filter:brightness(1.1); }
  .btn:disabled{ opacity:.45; cursor:not-allowed; filter:none; }
  .btn.sm{ padding:5px 9px; font-size:.75rem; }
  .btn.ghost{ background:transparent; }
  .btn.danger:hover{ border-color:var(--red); color:#ff6b72; }

  /* layout */
  .wrap{ display:grid; grid-template-columns:220px minmax(0,1fr); max-width:1180px; margin:0 auto; }
  nav.side{ position:sticky; top:62px; align-self:start; padding:24px 12px 24px 20px; display:flex; flex-direction:column; gap:2px; }
  nav.side a{ display:block; padding:9px 12px; border-radius:6px; color:var(--ink-2); text-decoration:none; font-weight:600; font-size:.9rem; }
  nav.side a:hover{ background:var(--panel); color:#fff; }
  nav.side a.on{ background:var(--panel-2); color:#fff; box-shadow:inset 3px 0 0 var(--red); }
  main{ padding:24px 20px 140px; min-width:0; }

  section.sec{ margin-bottom:40px; scroll-margin-top:80px; }
  section.sec > h2{ font-family:var(--display); font-weight:400; font-size:2rem; letter-spacing:.03em; margin:0 0 4px; }
  section.sec > p.hint{ margin:0 0 16px; color:var(--ink-3); font-size:.85rem; }

  .card{ background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:18px; margin-bottom:14px; }
  .card.item{ padding:0; }
  .item-head{ display:flex; align-items:center; gap:8px; padding:12px 14px; cursor:pointer; user-select:none; }
  .item-head .t{ flex:1; font-weight:700; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .item-head .sub{ color:var(--ink-3); font-weight:500; font-size:.8rem; margin-left:6px; }
  .item-head .chev{ color:var(--ink-3); transition:transform .2s; }
  .item.open .item-head .chev{ transform:rotate(90deg); }
  .item-body{ display:none; padding:4px 14px 16px; border-top:1px solid var(--line); }
  .item.open .item-body{ display:block; }

  .field{ margin:14px 0 0; }
  .field > label, .field > .lbl{ display:flex; align-items:center; gap:8px; font-size:.72rem; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-2); margin-bottom:6px; }
  .field .note{ text-transform:none; letter-spacing:0; font-weight:500; color:var(--ink-3); font-size:.75rem; }
  .field .rm-field{ margin-left:auto; }
  input[type=text], input[type=url], textarea{ width:100%; background:#0e0e0e; border:1px solid var(--line-2); border-radius:6px; padding:9px 11px; outline:none; }
  textarea{ resize:vertical; min-height:72px; line-height:1.5; }
  input:focus, textarea:focus{ border-color:#fff; }
  .count{ font-size:.7rem; color:var(--ink-3); text-align:right; margin-top:3px; }
  .row{ display:flex; gap:8px; align-items:flex-start; }
  .row > :first-child{ flex:1; min-width:0; }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:0 14px; }
  .list-row{ display:flex; gap:6px; align-items:flex-start; margin-bottom:8px; }
  .list-row > textarea, .list-row > input{ flex:1; min-width:0; }
  .list-tools{ display:flex; flex-direction:column; gap:4px; }
  .add{ margin-top:4px; }

  /* chips */
  .chips{ display:flex; flex-wrap:wrap; gap:6px; padding:6px; background:#0e0e0e; border:1px solid var(--line-2); border-radius:6px; }
  .chip{ display:inline-flex; align-items:center; gap:6px; background:#2a2a2a; border-radius:4px; padding:4px 6px 4px 10px; font-size:.82rem; }
  .chip button{ background:none; border:0; color:var(--ink-3); cursor:pointer; padding:0 2px; font-size:1rem; line-height:1; }
  .chip button:hover{ color:#fff; }
  .chips input{ flex:1; min-width:140px; background:transparent; border:0; outline:none; padding:4px; }

  /* images */
  .img-field{ display:flex; gap:12px; align-items:center; }
  .thumb{ width:92px; height:64px; flex:none; border-radius:6px; background:#0e0e0e center/contain no-repeat; border:1px solid var(--line-2); display:flex; align-items:center; justify-content:center; color:var(--ink-3); font-size:.7rem; }
  .img-meta{ flex:1; min-width:0; display:flex; flex-direction:column; gap:6px; }
  .img-actions{ display:flex; gap:6px; flex-wrap:wrap; }
  .gallery{ display:flex; flex-wrap:wrap; gap:10px; }
  .gallery .g{ width:128px; }
  .gallery .g .thumb{ width:128px; height:88px; }
  .gallery .g .img-actions{ margin-top:6px; }
  .pending{ color:var(--amber); font-size:.7rem; font-weight:700; }

  .switch{ display:flex; align-items:center; gap:8px; font-size:.9rem; color:var(--ink-2); }
  .addfield{ margin-top:14px; display:flex; gap:8px; align-items:center; }
  select{ background:#0e0e0e; border:1px solid var(--line-2); border-radius:6px; padding:7px 9px; }

  /* overlays */
  .overlay{ position:fixed; inset:0; z-index:50; background:rgba(0,0,0,.75); display:none; align-items:center; justify-content:center; padding:20px; }
  .overlay.on{ display:flex; }
  .dialog{ background:var(--panel); border:1px solid var(--line-2); border-radius:12px; width:min(520px,100%); padding:22px; }
  .dialog h3{ font-family:var(--display); font-weight:400; font-size:1.7rem; margin:0 0 8px; letter-spacing:.03em; }
  .dialog p{ color:var(--ink-2); margin:0 0 12px; line-height:1.55; }
  .dialog .actions{ display:flex; gap:8px; justify-content:flex-end; margin-top:16px; }
  .preview-box{ width:min(1280px,100%); height:min(860px,100%); background:#000; border:1px solid var(--line-2); border-radius:12px; overflow:hidden; display:flex; flex-direction:column; }
  .preview-top{ display:flex; gap:8px; align-items:center; padding:8px 10px; border-bottom:1px solid var(--line); }
  .preview-top .t{ flex:1; font-weight:700; font-size:.85rem; }
  .preview-stage{ flex:1; display:flex; justify-content:center; background:#111; overflow:auto; }
  .preview-stage iframe{ border:0; width:100%; height:100%; background:#000; }
  .preview-stage.mobile iframe{ width:390px; flex:none; border-left:1px solid var(--line); border-right:1px solid var(--line); }

  .toast{ position:fixed; left:50%; bottom:24px; transform:translateX(-50%); z-index:60; background:var(--panel-2); border:1px solid var(--line-2); border-radius:8px; padding:12px 16px; max-width:min(560px,calc(100% - 32px)); font-size:.9rem; display:none; box-shadow:0 20px 60px rgba(0,0,0,.6); }
  .toast.on{ display:block; }
  .toast.err{ border-color:var(--red); }
  .toast.ok{ border-color:var(--green); }

  .gate{ max-width:560px; margin:12vh auto; padding:0 20px; text-align:center; }
  .gate h1{ font-family:var(--display); font-weight:400; font-size:3rem; margin:0 0 10px; letter-spacing:.03em; }
  .gate p{ color:var(--ink-2); line-height:1.6; }
  .login{ display:flex; flex-direction:column; gap:10px; max-width:340px; margin:18px auto 0; text-align:left; }
  .login input{ width:100%; background:#0e0e0e; border:1px solid var(--line-2); border-radius:6px; padding:11px 12px; outline:none; font-size:1rem; }
  .login input:focus{ border-color:#fff; }
  .login .err{ color:#ff6b72; font-size:.85rem; min-height:1.2em; }

  @media (max-width: 820px){
    .wrap{ grid-template-columns:1fr; }
    nav.side{ position:static; flex-direction:row; overflow-x:auto; padding:8px 12px; background:var(--bg); border-bottom:1px solid var(--line); gap:4px; }
    nav.side a{ white-space:nowrap; padding:7px 10px; font-size:.82rem; }
    nav.side a.on{ box-shadow:inset 0 -2px 0 var(--red); }
    main{ padding:18px 14px 140px; }
    .grid2{ grid-template-columns:1fr; }
    .bar{ padding:10px 14px; flex-wrap:wrap; }
    .who{ display:none; }
    .status{ order:5; width:100%; }
  }
</style>
</head>
<body>

<div class="bar">
  <div class="brand">Portfolio <span>Admin</span></div>
  <div class="who" id="who"></div>
  <div class="spacer"></div>
  <div class="status" id="status">Loading…</div>
  <button class="btn" id="previewBtn" disabled>Preview</button>
  <button class="btn primary" id="saveBtn" disabled>Save &amp; publish</button>
  <button class="btn ghost" id="logoutBtn" hidden>Sign out</button>
</div>

<div id="app" hidden>
  <div class="wrap">
    <nav class="side" id="nav"></nav>
    <main id="main"></main>
  </div>
</div>

<div class="gate" id="gate">
  <h1>Loading…</h1>
  <p>Getting the latest content from GitHub.</p>
</div>

<!-- Save dialog -->
<div class="overlay" id="saveDlg">
  <div class="dialog">
    <h3>Publish changes</h3>
    <p>Your edits will be committed to GitHub and the live site updates in about 1–2 minutes.</p>
    <div class="field">
      <label for="msg">What did you change? <span class="note">(optional, shows in GitHub history)</span></label>
      <input type="text" id="msg" maxlength="120" placeholder="e.g. Update Forex Analyst description">
    </div>
    <div class="field" id="reauth" hidden>
      <label for="reauthPw">Session expired — enter your password <span class="note">(your edits are kept)</span></label>
      <input type="password" id="reauthPw" autocomplete="current-password" style="width:100%;background:#0e0e0e;border:1px solid var(--line-2);border-radius:6px;padding:9px 11px;outline:none">
    </div>
    <p id="saveSummary" style="margin-top:12px;font-size:.85rem"></p>
    <div class="actions">
      <button class="btn ghost" id="saveCancel">Cancel</button>
      <button class="btn primary" id="saveGo">Publish</button>
    </div>
  </div>
</div>

<!-- Preview -->
<div class="overlay" id="previewDlg">
  <div class="preview-box">
    <div class="preview-top">
      <div class="t">Preview (not published yet)</div>
      <button class="btn sm" id="pvDesktop">Desktop</button>
      <button class="btn sm" id="pvMobile">Mobile</button>
      <button class="btn sm" id="pvClose">Close</button>
    </div>
    <div class="preview-stage" id="pvStage"><iframe id="pvFrame" title="Preview"></iframe></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<input type="file" id="filePick" accept="image/*" hidden>

<script>
(() => {
  'use strict';

  const API = '/api/admin';

  /* ===========================================================
     What the editor knows about the content (labels, hints, input types).
     Anything not listed still shows up as a plain text field.
     =========================================================== */
  const SECTIONS = [
    { id: 'profile',    title: 'Profile & intro', keys: ['profile', 'intro', 'accentColor'], hint: 'Your name, the hero line and the photo at the top of the page.' },
    { id: 'about',      title: 'About',           keys: ['about'], hint: 'The “About” section.' },
    { id: 'education',  title: 'Background',      keys: ['education'], hint: 'The “My background” card and its popup.' },
    { id: 'experience', title: 'Experience',      keys: ['experience'], hint: 'Roles are shown in this order. Use ↑ ↓ to reorder.' },
    { id: 'projects',   title: 'Projects',        keys: ['projects'], hint: 'Project cards and their detail popups, in this order.' },
    { id: 'skills',     title: 'Skills',          keys: ['skills'], hint: 'Used by the Portfolio Guider to answer “does he know X?”.' },
    { id: 'contact',    title: 'Links & contact', keys: ['links', 'contact', 'resume'], hint: 'Footer links, contact section and resume link.' }
  ];

  const LABELS = {
    accentColor: 'Accent colour', photo: 'Cover photo', photoReveal: 'Reveal photo', hello: 'Intro word', sub: 'Subtitle',
    tagline: 'Hero tagline', paragraphs: 'Paragraphs', focus: 'Focus areas', tools: 'Tools', badge: 'Text badge',
    logo: 'Logo', banner: 'Popup banner', degree: 'Degree', minor: 'Minor', notes: 'Card text', org: 'Organisation',
    type: 'Type', period: 'Dates', summary: 'Card summary', highlights: 'Bullet points', skills: 'Skills', project: 'Linked project title',
    images: 'Gallery images', cover: 'Card image', backdrop: 'Backdrop image', heroImage: 'Popup banner image', video: 'Video link',
    videoBelow: 'Show video below the text', videoLabel: 'Video label', description: 'Detail paragraphs', tags: 'Tags',
    links: 'Links', label: 'Label', url: 'URL', heading: 'Heading', initials: 'Initials', role: 'Role', email: 'Email'
  };
  const NOTES = {
    summary: 'shown on the card — about 150 characters fits',
    project: 'exact title of a project, adds a “View project” button',
    video: 'YouTube / Vimeo link or a file name',
    url: 'web link or a file name in the site folder',
    initials: 'shown in the logo',
    photoReveal: 'revealed when you brush over the cover photo'
  };
  const IMAGE_KEYS = new Set(['photo', 'photoReveal', 'logo', 'banner', 'cover', 'backdrop', 'heroImage']);
  const IMAGE_LIST_KEYS = new Set(['images']);
  const CHIP_KEYS = new Set(['focus', 'tools', 'skills', 'tags']);
  const LONG_TEXT_KEYS = new Set(['tagline', 'summary', 'sub']);
  const PARA_LIST_KEYS = new Set(['paragraphs', 'description', 'highlights', 'notes']);

  const TEMPLATES = {
    experience: () => ({ role: '', org: '', logo: '', type: '', period: '', location: '', summary: '', highlights: [], skills: [] }),
    projects: () => ({ title: 'New project', category: '', year: String(new Date().getFullYear()), summary: '', cover: '', images: [], description: [''], tags: [], links: [] }),
    links: () => ({ label: '', url: '' })
  };
  const OPTIONAL = {
    experience: { logo: '', location: '', images: [], project: '', highlights: [] },
    projects: { cover: '', logo: '', backdrop: '', heroImage: '', video: '', videoBelow: true, videoLabel: '', images: [], links: [] }
  };

  /* ===========================================================
     State
     =========================================================== */
  let data = null;          // the SITE_CONTENT object being edited
  let header = '';          // comment block at the top of content.js (kept as-is)
  let baseBlobSha = '';     // git blob sha of content.js we loaded (conflict check)
  let savedJson = '';       // JSON of data at last load/save (dirty check)
  const pending = new Map(); // path → { base64, url } images uploaded but not yet published

  const $ = s => document.querySelector(s);
  const el = (tag, attrs = {}, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === 'class') n.className = v;
      else if (k === 'text') n.textContent = v;
      else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
      else if (v !== undefined && v !== null && v !== false) n.setAttribute(k, v === true ? '' : v);
    }
    kids.flat().forEach(c => c != null && n.append(c.nodeType ? c : document.createTextNode(String(c))));
    return n;
  };
  const label = k => LABELS[k] || String(k).replace(/([a-z])([A-Z])/g, '$1 $2').replace(/^./, c => c.toUpperCase());

  /* ===========================================================
     Load
     =========================================================== */
  async function api(path, opts) {
    const r = await fetch(API + path, { credentials: 'same-origin', cache: 'no-store', ...opts });
    let body = {};
    try { body = await r.json(); } catch {}
    if (!r.ok) { const e = new Error(body.error || `Request failed (${r.status})`); e.status = r.status; throw e; }
    return body;
  }

  function parseContent(text) {
    const box = {};
    // content.js is our own file; run it against a throwaway "window" to read the object.
    new Function('window', text)(box);
    if (!box.SITE_CONTENT || typeof box.SITE_CONTENT !== 'object') throw new Error('content.js did not define window.SITE_CONTENT');
    const i = text.indexOf('window.SITE_CONTENT');
    return { obj: JSON.parse(JSON.stringify(box.SITE_CONTENT)), header: i > 0 ? text.slice(0, i) : '' };
  }

  async function load() {
    try {
      await api('/me');
      $('#who').textContent = 'Signed in';
      $('#logoutBtn').hidden = false;
      const c = await api('/content');
      const parsed = parseContent(c.text);
      data = parsed.obj; header = parsed.header; baseBlobSha = c.blobSha;
      savedJson = JSON.stringify(data);
      $('#gate').hidden = true; $('#app').hidden = false;
      $('#previewBtn').disabled = false;
      render();
      updateStatus();
    } catch (e) {
      if (e.status === 401) return showLogin();
      gate(e.status === 503 ? 'Almost there' : 'Could not load', e.message);
    }
  }
  function showLogin(msg) {
    const g = $('#gate'); g.hidden = false; $('#app').hidden = true;
    $('#status').textContent = ''; $('#logoutBtn').hidden = true; $('#who').textContent = '';
    const pw = el('input', { type: 'password', id: 'pw', autocomplete: 'current-password', placeholder: 'Password', 'aria-label': 'Password' });
    const err = el('div', { class: 'err', text: msg || '' });
    const go = el('button', { class: 'btn primary', type: 'submit', text: 'Sign in' });
    const form = el('form', { class: 'login' }, pw, go, err);
    form.addEventListener('submit', async ev => {
      ev.preventDefault();
      if (!pw.value) return;
      go.disabled = true; go.textContent = 'Signing in…'; err.textContent = '';
      try {
        await api('/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: pw.value }) });
        pw.value = '';
        g.replaceChildren(el('h1', { text: 'Loading…' }), el('p', { text: 'Getting the latest content from GitHub.' }));
        load();
      } catch (e2) {
        err.textContent = e2.message; go.disabled = false; go.textContent = 'Sign in'; pw.select();
      }
    });
    g.replaceChildren(el('h1', { text: 'Sign in' }), el('p', { text: 'Enter your admin password to edit the site.' }), form);
    pw.focus();
  }
  function gate(title, msg) {
    const g = $('#gate'); g.hidden = false; $('#app').hidden = true;
    g.replaceChildren(el('h1', { text: title }), el('p', { text: msg }), el('p', {}, el('button', { class: 'btn', text: 'Try again', onclick: () => location.reload() })));
    $('#status').textContent = '';
  }

  /* ===========================================================
     Rendering
     =========================================================== */
  function render() {
    const nav = $('#nav'), main = $('#main');
    const scroll = window.scrollY;
    nav.replaceChildren(); main.replaceChildren();
    const used = new Set();
    const sections = SECTIONS.map(s => ({ ...s, keys: s.keys.filter(k => k in data) })).filter(s => s.keys.length);
    sections.forEach(s => s.keys.forEach(k => used.add(k)));
    const other = Object.keys(data).filter(k => !used.has(k));
    if (other.length) sections.push({ id: 'other', title: 'Other', keys: other, hint: 'Other settings.' });

    for (const s of sections) {
      nav.append(el('a', { href: '#sec-' + s.id, 'data-sec': s.id, text: s.title }));
      const sec = el('section', { class: 'sec', id: 'sec-' + s.id }, el('h2', { text: s.title }), el('p', { class: 'hint', text: s.hint }));
      for (const k of s.keys) {
        const v = data[k];
        if (Array.isArray(v) && v.every(x => x && typeof x === 'object' && !Array.isArray(x))) {
          sec.append(objectList(data, k, k));
        } else if (v && typeof v === 'object' && !Array.isArray(v)) {
          if (k === 'skills') sec.append(el('div', { class: 'card' }, groupMap(data, k)));
          else sec.append(el('div', { class: 'card' }, ...Object.keys(v).map(kk => field(v, kk, k))));
        } else {
          sec.append(el('div', { class: 'card' }, field(data, k, '')));
        }
      }
      main.append(sec);
    }
    window.scrollTo(0, scroll);
    spy();
  }

  // A single key on an object → the right input
  function field(obj, key, ctx, opts = {}) {
    const v = obj[key];
    const wrap = el('div', { class: 'field' });
    const lab = el('div', { class: 'lbl' }, label(key), NOTES[key] ? el('span', { class: 'note', text: NOTES[key] }) : null);
    if (opts.removable) lab.append(el('button', { class: 'btn sm ghost danger rm-field', text: 'Remove field', onclick: () => { delete obj[key]; changed(true); } }));
    wrap.append(lab);

    if (key === 'links' && Array.isArray(v)) { wrap.append(objectList(obj, key, 'links')); return wrap; }
    if (IMAGE_KEYS.has(key) && typeof v === 'string') { wrap.append(imageInput(obj, key)); return wrap; }
    if (IMAGE_LIST_KEYS.has(key) && Array.isArray(v)) { wrap.append(gallery(v)); return wrap; }
    if (CHIP_KEYS.has(key) && Array.isArray(v) && v.every(x => typeof x === 'string')) { wrap.append(chips(v)); return wrap; }
    if (Array.isArray(v) && v.every(x => typeof x === 'string')) { wrap.append(stringList(v, PARA_LIST_KEYS.has(key) || v.some(x => x.length > 70))); return wrap; }
    if (Array.isArray(v) && v.length && v.every(x => x && typeof x === 'object')) { wrap.append(objectList(obj, key, key)); return wrap; }
    if (typeof v === 'boolean') {
      const cb = el('input', { type: 'checkbox' }); cb.checked = v;
      cb.addEventListener('change', () => { obj[key] = cb.checked; changed(); });
      wrap.append(el('label', { class: 'switch' }, cb, v ? 'On' : 'Off'));
      cb.addEventListener('change', () => { cb.nextSibling.textContent = cb.checked ? 'On' : 'Off'; });
      return wrap;
    }
    if (key === 'accentColor') {
      const color = el('input', { type: 'color', value: /^#[0-9a-f]{6}$/i.test(v) ? v : '#2440FF', style: 'width:48px;height:38px;border:0;background:none;padding:0' });
      const txt = el('input', { type: 'text', value: v || '' });
      color.addEventListener('input', () => { txt.value = color.value; obj[key] = color.value; changed(); });
      txt.addEventListener('input', () => { obj[key] = txt.value; changed(); });
      wrap.append(el('div', { class: 'row' }, txt, color));
      return wrap;
    }
    if (v && typeof v === 'object') { // nested object (rare)
      wrap.append(el('div', { class: 'card' }, ...Object.keys(v).map(kk => field(v, kk, key))));
      return wrap;
    }
    const long = LONG_TEXT_KEYS.has(key) || String(v ?? '').length > 80;
    const input = long ? el('textarea', { rows: 3 }) : el('input', { type: 'text' });
    input.value = v ?? '';
    const count = key === 'summary' ? el('div', { class: 'count' }) : null;
    const upd = () => { if (count) { const n = input.value.length; count.textContent = n + ' characters' + (n > 160 ? ' — may be cut off on the card' : ''); count.style.color = n > 160 ? 'var(--amber)' : ''; } };
    input.addEventListener('input', () => { obj[key] = input.value; changed(); upd(); refreshTitles(); });
    upd();
    wrap.append(input); if (count) wrap.append(count);
    return wrap;
  }

  // Paragraph / bullet lists
  function stringList(arr, long) {
    const box = el('div');
    const draw = () => {
      box.replaceChildren();
      arr.forEach((s, i) => {
        const input = long ? el('textarea', { rows: 3 }) : el('input', { type: 'text' });
        input.value = s;
        input.addEventListener('input', () => { arr[i] = input.value; changed(); });
        box.append(el('div', { class: 'list-row' }, input, el('div', { class: 'list-tools' },
          el('button', { class: 'btn sm', title: 'Move up', text: '↑', disabled: i === 0, onclick: () => { [arr[i - 1], arr[i]] = [arr[i], arr[i - 1]]; changed(); draw(); } }),
          el('button', { class: 'btn sm', title: 'Move down', text: '↓', disabled: i === arr.length - 1, onclick: () => { [arr[i + 1], arr[i]] = [arr[i], arr[i + 1]]; changed(); draw(); } }),
          el('button', { class: 'btn sm danger', title: 'Delete', text: '✕', onclick: () => { if (!arr[i] || confirm('Delete this paragraph?')) { arr.splice(i, 1); changed(); draw(); } } })
        )));
      });
      box.append(el('button', { class: 'btn sm add', text: long ? '+ Add paragraph' : '+ Add line', onclick: () => { arr.push(''); changed(); draw(); const last = box.querySelectorAll('textarea,input'); last[last.length - 1].focus(); } }));
    };
    draw();
    return box;
  }

  // Tag-style lists
  function chips(arr) {
    const box = el('div', { class: 'chips' });
    const input = el('input', { type: 'text', placeholder: 'Type and press Enter' });
    const draw = () => {
      box.replaceChildren();
      arr.forEach((s, i) => box.append(el('span', { class: 'chip' }, s, el('button', { title: 'Remove', text: '×', onclick: () => { arr.splice(i, 1); changed(); draw(); } }))));
      box.append(input);
    };
    const add = () => { const t = input.value.trim(); if (t) { t.split(/\s*,\s*/).filter(Boolean).forEach(x => arr.push(x)); input.value = ''; changed(); draw(); input.focus(); } };
    input.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ',') { e.preventDefault(); add(); } else if (e.key === 'Backspace' && !input.value && arr.length) { arr.pop(); changed(); draw(); input.focus(); } });
    input.addEventListener('blur', add);
    draw();
    return box;
  }

  // Skills: { "Group": ["a","b"] }
  function groupMap(parent, key) {
    const map = parent[key];
    const box = el('div');
    Object.keys(map).forEach(g => {
      const name = el('input', { type: 'text', value: g });
      name.addEventListener('change', () => {
        const nn = name.value.trim();
        if (!nn || nn === g) { name.value = g; return; }
        if (nn in map) { toast('A group with that name already exists.', 'err'); name.value = g; return; }
        // rebuild to keep order
        const entries = Object.entries(map).map(([k, v]) => [k === g ? nn : k, v]);
        Object.keys(map).forEach(k => delete map[k]); entries.forEach(([k, v]) => map[k] = v);
        changed(true);
      });
      box.append(el('div', { class: 'field' },
        el('div', { class: 'row' }, name, el('button', { class: 'btn sm danger', text: 'Delete group', onclick: () => { if (confirm(`Delete the “${g}” group?`)) { delete map[g]; changed(true); } } })),
        el('div', { style: 'margin-top:8px' }, chips(map[g]))));
    });
    box.append(el('button', { class: 'btn sm add', style: 'margin-top:14px', text: '+ Add group', onclick: () => {
      let n = 'New group', i = 2; while (n in map) n = 'New group ' + i++;
      map[n] = []; changed(true);
    } }));
    return box;
  }

  // Lists of objects (experience, projects, links)
  function objectList(parent, key, kind) {
    const arr = parent[key];
    const box = el('div');
    const isLinks = kind === 'links';
    arr.forEach((item, i) => {
      if (isLinks) {
        const lab = el('input', { type: 'text', value: item.label || '', placeholder: 'Label' });
        const url = el('input', { type: 'text', value: item.url || '', placeholder: 'https://… or file name' });
        lab.addEventListener('input', () => { item.label = lab.value; changed(); });
        url.addEventListener('input', () => { item.url = url.value; changed(); });
        box.append(el('div', { class: 'list-row' }, el('div', { class: 'grid2', style: 'flex:1;gap:6px' }, lab, url), el('div', { class: 'list-tools' },
          el('button', { class: 'btn sm', text: '↑', disabled: i === 0, onclick: () => { move(arr, i, -1); } }),
          el('button', { class: 'btn sm danger', text: '✕', onclick: () => { arr.splice(i, 1); changed(true); } }))));
        return;
      }
      const card = el('div', { class: 'card item', 'data-path': key + '.' + i });
      const t = el('span', { class: 't' });
      const head = el('div', { class: 'item-head', onclick: e => { if (!e.target.closest('button')) card.classList.toggle('open'); } },
        el('span', { class: 'chev', text: '▶' }), t,
        el('button', { class: 'btn sm', title: 'Move up', text: '↑', disabled: i === 0, onclick: () => move(arr, i, -1) }),
        el('button', { class: 'btn sm', title: 'Move down', text: '↓', disabled: i === arr.length - 1, onclick: () => move(arr, i, 1) }),
        el('button', { class: 'btn sm danger', text: 'Delete', onclick: () => { if (confirm(`Delete “${titleOf(item) || 'this item'}”? You can still cancel by not publishing.`)) { arr.splice(i, 1); changed(true); } } }));
      card._titleEl = t; card._item = item;
      const body = el('div', { class: 'item-body' });
      const optional = OPTIONAL[kind] || {};
      Object.keys(item).forEach(k => body.append(field(item, k, kind, { removable: k in optional })));
      const missing = Object.keys(optional).filter(k => !(k in item));
      if (missing.length) {
        const sel = el('select', {}, el('option', { value: '', text: 'Add an optional field…' }), ...missing.map(k => el('option', { value: k, text: label(k) })));
        sel.addEventListener('change', () => { if (!sel.value) return; const d = optional[sel.value]; item[sel.value] = Array.isArray(d) ? [] : d; openPaths.add(key + '.' + i); changed(true); });
        body.append(el('div', { class: 'addfield' }, sel));
      }
      card.append(head, body);
      if (openPaths.has(key + '.' + i)) card.classList.add('open');
      head.addEventListener('click', () => { if (card.classList.contains('open')) openPaths.add(key + '.' + i); else openPaths.delete(key + '.' + i); });
      box.append(card);
    });
    const tmpl = TEMPLATES[kind];
    if (tmpl) box.append(el('button', { class: 'btn sm add', text: isLinks ? '+ Add link' : kind === 'projects' ? '+ Add project' : kind === 'experience' ? '+ Add role' : '+ Add item', onclick: () => {
      arr.push(tmpl()); if (!isLinks) openPaths.add(key + '.' + (arr.length - 1)); changed(true);
    } }));
    setTimeout(refreshTitles);
    return box;
  }
  const openPaths = new Set();
  function move(arr, i, d) { const j = i + d; if (j < 0 || j >= arr.length) return; [arr[i], arr[j]] = [arr[j], arr[i]]; openPaths.clear(); changed(true); }
  function titleOf(it) { return it.title || it.role || it.label || it.school || ''; }
  function refreshTitles() {
    document.querySelectorAll('.card.item').forEach(c => {
      const it = c._item; if (!it) return;
      c._titleEl.replaceChildren(titleOf(it) || 'Untitled', el('span', { class: 'sub', text: [it.org, it.period || it.year, it.category].filter(Boolean).join(' · ') }));
    });
  }

  /* ---------- images ---------- */
  function srcFor(path) {
    if (!path) return '';
    if (pending.has(path)) return pending.get(path).url;
    if (/^(https?:|data:)/.test(path)) return path;
    return '/' + path.replace(/^\.?\//, '');
  }
  function thumb(path) {
    const t = el('div', { class: 'thumb' });
    if (path) t.style.backgroundImage = `url("${srcFor(path).replace(/"/g, '%22')}")`; else t.textContent = 'No image';
    return t;
  }
  function imageInput(obj, key) {
    const box = el('div', { class: 'img-field' });
    const draw = () => {
      const name = el('input', { type: 'text', value: obj[key] || '', placeholder: 'file name, e.g. my-photo.webp' });
      name.addEventListener('change', () => { obj[key] = name.value.trim(); changed(); draw(); });
      box.replaceChildren(thumb(obj[key]), el('div', { class: 'img-meta' }, name,
        el('div', { class: 'img-actions' },
          el('button', { class: 'btn sm', text: obj[key] ? 'Replace image' : 'Upload image', onclick: () => pickImage(path => { obj[key] = path; changed(); draw(); }) }),
          obj[key] ? el('button', { class: 'btn sm ghost danger', text: 'Clear', onclick: () => { obj[key] = ''; changed(); draw(); } }) : null,
          pending.has(obj[key]) ? el('span', { class: 'pending', text: 'New — uploads when you publish' }) : null)));
    };
    draw();
    return box;
  }
  function gallery(arr) {
    const box = el('div');
    const draw = () => {
      const g = el('div', { class: 'gallery' });
      arr.forEach((p, i) => g.append(el('div', { class: 'g' }, thumb(p), el('div', { class: 'img-actions' },
        el('button', { class: 'btn sm', text: '←', title: 'Move left', disabled: i === 0, onclick: () => { [arr[i - 1], arr[i]] = [arr[i], arr[i - 1]]; changed(); draw(); } }),
        el('button', { class: 'btn sm', text: '→', title: 'Move right', disabled: i === arr.length - 1, onclick: () => { [arr[i + 1], arr[i]] = [arr[i], arr[i + 1]]; changed(); draw(); } }),
        el('button', { class: 'btn sm danger', text: '✕', title: 'Remove', onclick: () => { arr.splice(i, 1); changed(); draw(); } })),
        pending.has(p) ? el('div', { class: 'pending', text: 'New' }) : null)));
      box.replaceChildren(g, el('button', { class: 'btn sm add', style: 'margin-top:10px', text: '+ Add image', onclick: () => pickImage(path => { arr.push(path); changed(); draw(); }) }));
    };
    draw();
    return box;
  }

  let pickCb = null;
  function pickImage(cb) { pickCb = cb; $('#filePick').value = ''; $('#filePick').click(); }
  $('#filePick').addEventListener('change', async () => {
    const f = $('#filePick').files[0]; if (!f || !pickCb) return;
    try {
      toast('Preparing image…');
      const { base64, ext, url } = await toWebp(f);
      const base = f.name.replace(/\.[^.]+$/, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40) || 'image';
      const path = `uploads/${base}-${Math.random().toString(36).slice(2, 7)}.${ext}`;
      pending.set(path, { base64, url });
      pickCb(path);
      toast(`Added ${path}. It uploads when you publish.`, 'ok');
    } catch (e) { toast('Could not use that image: ' + e.message, 'err'); }
  });

  // Resize to max 2000px and convert to WebP (keeps the site fast)
  async function toWebp(file) {
    if (!file.type.startsWith('image/')) throw new Error('not an image');
    const bmp = await createImageBitmap(file);
    const max = 2000, s = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    let blob = await new Promise(r => c.toBlob(r, 'image/webp', 0.85));
    let ext = 'webp';
    if (!blob || blob.type !== 'image/webp') { blob = await new Promise(r => c.toBlob(r, 'image/png')); ext = 'png'; }
    if (blob.size > 4 * 1024 * 1024) throw new Error('still larger than 4 MB after compressing');
    const buf = new Uint8Array(await blob.arrayBuffer());
    let bin = ''; for (let i = 0; i < buf.length; i += 0x8000) bin += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000));
    return { base64: btoa(bin), ext, url: URL.createObjectURL(blob) };
  }

  /* ===========================================================
     Change tracking
     =========================================================== */
  function isDirty() { return JSON.stringify(data) !== savedJson; }
  function changed(rerender) { updateStatus(); if (rerender) render(); }
  function updateStatus() {
    const d = isDirty();
    const s = $('#status');
    s.textContent = d ? 'Unsaved changes' : 'All changes published';
    s.classList.toggle('dirty', d);
    $('#saveBtn').disabled = !d;
  }
  window.addEventListener('beforeunload', e => { if (data && isDirty()) { e.preventDefault(); e.returnValue = ''; } });

  /* ===========================================================
     content.js writer
     =========================================================== */
  const IDENT = /^[A-Za-z_$][A-Za-z0-9_$]*$/;
  function lit(v, ind) {
    const pad = '  '.repeat(ind), pad1 = '  '.repeat(ind + 1);
    if (v === null || v === undefined) return 'null';
    if (typeof v === 'string') return JSON.stringify(v);
    if (typeof v === 'number' || typeof v === 'boolean') return String(v);
    if (Array.isArray(v)) {
      if (!v.length) return '[]';
      const flat = v.every(x => typeof x !== 'object' || x === null);
      const one = '[' + v.map(x => lit(x, 0)).join(', ') + ']';
      if (flat && one.length + pad.length < 120 && v.every(x => typeof x !== 'string' || x.length < 60)) return one;
      const smallObjs = v.every(x => x && typeof x === 'object' && !Array.isArray(x) && Object.values(x).every(y => typeof y !== 'object'));
      if (smallObjs) {
        const lines = v.map(x => '{ ' + Object.keys(x).map(k => key(k) + ': ' + lit(x[k], 0)).join(', ') + ' }');
        if (lines.every(l => l.length + pad1.length < 130)) return '[\n' + lines.map(l => pad1 + l).join(',\n') + '\n' + pad + ']';
      }
      return '[\n' + v.map(x => pad1 + lit(x, ind + 1)).join(',\n') + '\n' + pad + ']';
    }
    const keys = Object.keys(v);
    if (!keys.length) return '{}';
    return '{\n' + keys.map(k => pad1 + key(k) + ': ' + lit(v[k], ind + 1)).join(',\n') + '\n' + pad + '}';
  }
  function key(k) { return IDENT.test(k) ? k : JSON.stringify(k); }

  function buildText(obj) {
    const head = header || '/* Website content — edit at /admin or by hand. */\n\n';
    return head + 'window.SITE_CONTENT = ' + lit(obj, 0) + ';\n';
  }

  // Every image path still used somewhere in the content
  function usedPaths(obj, out = new Set()) {
    if (typeof obj === 'string') { if (pending.has(obj)) out.add(obj); }
    else if (obj && typeof obj === 'object') Object.values(obj).forEach(v => usedPaths(v, out));
    return out;
  }

  /* ===========================================================
     Save
     =========================================================== */
  $('#saveBtn').addEventListener('click', () => {
    const imgs = usedPaths(data).size;
    $('#saveSummary').textContent = imgs ? `${imgs} new image${imgs > 1 ? 's' : ''} will be uploaded.` : '';
    $('#saveDlg').classList.add('on'); $('#msg').focus();
  });
  $('#saveCancel').addEventListener('click', () => $('#saveDlg').classList.remove('on'));
  $('#saveGo').addEventListener('click', async () => {
    const go = $('#saveGo'); go.disabled = true; go.textContent = 'Publishing…';
    try {
      if (!$('#reauth').hidden) {
        await api('/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: $('#reauthPw').value }) });
        $('#reauthPw').value = ''; $('#reauth').hidden = true;
      }
      const text = buildText(data);
      // Sanity check: the file we are about to publish must load back to the same content.
      if (JSON.stringify(parseContent(text).obj) !== JSON.stringify(data)) throw new Error('internal check failed — nothing was published');
      const uploads = [...usedPaths(data)].map(p => ({ path: p, base64: pending.get(p).base64 }));
      const res = await api('/save', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text, baseBlobSha, uploads, message: $('#msg').value }) });
      baseBlobSha = res.blobSha;
      savedJson = JSON.stringify(data);
      uploads.forEach(u => { pending.delete(u.path); });
      $('#saveDlg').classList.remove('on'); $('#msg').value = '';
      updateStatus(); render();
      toast(`Published (commit ${res.commit.slice(0, 7)}). The live site updates in about 1–2 minutes.`, 'ok', 9000);
    } catch (e) {
      if (e.status === 401) { $('#reauth').hidden = false; $('#reauthPw').focus(); toast(e.message === 'Not signed in.' ? 'Session expired — enter your password and press Publish again.' : e.message, 'err', 8000); }
      else toast(e.message, 'err', 12000);
    } finally { go.disabled = false; go.textContent = 'Publish'; }
  });

  /* ===========================================================
     Preview
     =========================================================== */
  let siteHtml = null;
  $('#previewBtn').addEventListener('click', async () => {
    try {
      if (!siteHtml) siteHtml = await fetch('/index.html', { cache: 'no-store' }).then(r => { if (!r.ok) throw new Error('could not load index.html'); return r.text(); });
      // Swap not-yet-uploaded images for local data so they show in the preview.
      const copy = JSON.parse(JSON.stringify(data), (k, v) => typeof v === 'string' && pending.has(v) ? pending.get(v).url : v);
      const inline = '<script>window.SITE_CONTENT = ' + JSON.stringify(copy).replace(/</g, '\\x3c') + ';<\/script>';
      let html = siteHtml.replace(/<script\s+src=["']content\.js["']\s*><\/script>/, () => inline);
      html = html.replace(/<head([^>]*)>/i, (m) => m + '<base href="' + location.origin + '/">');
      $('#pvFrame').srcdoc = html;
      $('#previewDlg').classList.add('on');
    } catch (e) { toast('Preview failed: ' + e.message, 'err'); }
  });
  $('#pvClose').addEventListener('click', () => { $('#previewDlg').classList.remove('on'); $('#pvFrame').srcdoc = ''; });
  $('#pvDesktop').addEventListener('click', () => $('#pvStage').classList.remove('mobile'));
  $('#pvMobile').addEventListener('click', () => $('#pvStage').classList.add('mobile'));
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { $('#previewDlg').classList.remove('on'); $('#saveDlg').classList.remove('on'); } });

  /* ---------- misc ---------- */
  let toastT;
  function toast(msg, kind = '', ms = 4000) {
    const t = $('#toast'); t.textContent = msg; t.className = 'toast on ' + kind;
    clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), ms);
  }
  function spy() {
    const links = [...document.querySelectorAll('#nav a')];
    const io = new IntersectionObserver(es => es.forEach(e => {
      if (e.isIntersecting) links.forEach(a => a.classList.toggle('on', a.dataset.sec === e.target.id.replace('sec-', '')));
    }), { rootMargin: '-30% 0px -60% 0px' });
    document.querySelectorAll('section.sec').forEach(s => io.observe(s));
  }

  $('#logoutBtn').addEventListener('click', async () => {
    if (data && isDirty() && !confirm('You have unpublished changes. Sign out anyway?')) return;
    try { await api('/logout', { method: 'POST' }); } catch {}
    data = null; showLogin('Signed out.');
  });

  window.__admin = { buildText, parseContent, get data() { return data; } };   // for testing
  load();
})();
</script>
</body>
</html>
